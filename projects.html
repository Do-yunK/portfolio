<section id="projects" class="bg-white section-spacing">
  <div class="container portfolio-container portfolio-content-backdrop">
    <div class="portfolio-section-heading">
      <h2> </h2>
      <span>WHAT I'VE BEEN UP TO</span>
    </div>

    <div class="portfolio-panel">
      <div class="portfolio-panel-header project-gallery-header">
        <h3>PROJECT GALLERY</h3>
        <div class="d-flex align-items-center gap-2">
          <span class="inventory-slots-count small text-muted me-1">5 ITEMS</span>
          <button type="button" class="btn btn-outline-secondary btn-sm py-0 px-2" id="projPrev"
            aria-label="Previous projects">&larr;</button>
          <button type="button" class="btn btn-outline-secondary btn-sm py-0 px-2" id="projNext"
            aria-label="Next projects">&rarr;</button>
        </div>
      </div>

      <div class="portfolio-panel-body">
        <div class="project-track d-flex gap-4 pt-2 pb-2" id="projectTrack" role="region" aria-label="Projects"
          tabindex="0">
          <!-- Project 1 -->
          <div class="project-slide">
            <article class="card project-card h-100 border-0 shadow-sm">
              <div class="project-card-header">
                <h3 class="card-title h6 fw-bold">
                  <button type="button" class="project-preview-trigger stretched-link" data-bs-toggle="modal"
                    data-bs-target="#projectPreview" data-preview-src="images/HIRONO_Proposal.png"
                    data-preview-alt="Hirono AR experience project proposal" data-preview-gallery="hirono">HIRONO AR</button>
                </h3>
              </div>
              <img src="images/Hirono.png" class="card-img-top" alt="Hirono AR experience" loading="lazy" width="400"
                height="300">
              <div class="card-body p-3">
                <p class="card-text small text-muted mb-0 card-text-clamp">AR experience for Hirono blindboxes made with
                  Effect House.</p>
              </div>
            </article>
          </div>

          <!-- Project 2 -->
          <div class="project-slide">
            <article class="card project-card h-100 border-0 shadow-sm">
              <div class="project-card-header">
                <h3 class="card-title h6 fw-bold">
                  <button type="button" class="project-preview-trigger stretched-link" data-bs-toggle="modal"

                    data-preview-alt="Keepsake AR prototype" data-preview-gallery="keepsake">FIGBUILD
                    2026</button>
                </h3>
              </div>
              <img src="images/Keepsake.png" class="card-img-top" alt="Keepsake AR prototype" loading="lazy" width="400"
                height="300">
              <div class="card-body p-3">
                <p class="card-text small text-muted mb-0 card-text-clamp">Keepsake, an AR prototype.</p>
              </div>
            </article>
          </div>

          <!-- Project 3 -->
          <div class="project-slide">
            <article class="card project-card h-100 border-0 shadow-sm">
              <div class="project-card-header">
                <h3 class="card-title h6 fw-bold">
                  <button type="button" class="project-preview-trigger stretched-link" data-bs-toggle="modal"
                    data-bs-target="#projectPreview" data-preview-src="images/RemovedHistory.png"
                    data-preview-alt="ReSpotify removed history design">ReSpotify</button>
                </h3>
              </div>
              <img src="images/ReSpotify.png" class="card-img-top respotify-thumbnail" alt="ReSpotify redesign"

              <div class="card-body p-3">
                <p class="card-text small text-muted mb-0 card-text-clamp">UX Casestudy, redesign of Spotify features.
                </p>
              </div>
            </article>
          </div>

          <!-- Project 5 -->
          <div class="project-slide">
            <article class="card project-card h-100 border-0 shadow-sm">
              <div class="project-card-header">
                <h3 class="card-title h6 fw-bold">
                  <button type="button" class="project-preview-trigger stretched-link" data-bs-toggle="modal"
                    data-bs-target="#projectPreview" data-preview-src="images/Motion_Design.png"
                    data-preview-alt="Motion design illustration of a wolf in a blue forest">Motion Design</button>
                </h3>
              </div>
              <img src="images/Lamb.png" class="card-img-top" alt="Lamb illustration in a blue forest" loading="lazy"

              <div class="card-body p-3">
                <p class="card-text small text-muted mb-0 card-text-clamp">Composition done in After Effects</p>
              </div>
            </article>
          </div>

          <!-- Project 4 -->
          <div class="project-slide">
            <article class="card project-card h-100 border-0 shadow-sm">
              <div class="project-card-header">
                <h3 class="card-title h6 fw-bold">
                  <button type="button" class="project-preview-trigger stretched-link" data-bs-toggle="modal"

              </div>
              <img src="images/Techdrawing.png" class="card-img-top" alt="Technical Drawing project" loading="lazy"

              <div class="card-body p-3">
                <p class="card-text small text-muted mb-0 card-text-clamp">Short description of project four.</p>
              </div>
            </article>
          </div>

      </div>

            <img src="images/FILTER2.png" class="img-fluid w-100 mt-3" alt="First steps of the Hirono AR filter experience"
              width="1920" height="1080" loading="lazy">
            <img src="images/FILTER3.png" class="img-fluid w-100 mt-3" alt="Hirono AR filter reveal process"
